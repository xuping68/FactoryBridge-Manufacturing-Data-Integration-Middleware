name: FactoryBridge verification
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Java format, unit, contract, architecture and PostgreSQL integration tests
        run: ./mvnw -B -ntp spotless:check verify
      - name: Simulator contract tests
        run: python3 -m unittest discover -s demo -p 'test_*.py' -v
      - name: Build and start the actual Demo
        run: docker compose up --build --wait --wait-timeout 180
      - name: End-to-end failure and recovery scenarios
        run: python3 demo/smoke-test.py
      - name: Collect container logs
        if: always()
        run: docker compose logs --no-color > compose.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-evidence
          path: |
            target/surefire-reports
            target/failsafe-reports
            target/site/jacoco
            compose.log
      - name: Stop test containers
        if: always()
        run: docker compose down
